$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Publication Card
status: stable
description: Card component for displaying publication information with downloadable file
props:
  type: object
  properties:
    theme:
      type: ['string', 'null']
      title: Theme
      description: Theme variation (light or dark).
      enum:
        - light
        - dark
      examples:
        - light
    image:
      $ref: json-schema-definitions://experience_builder.module/image
      type: ['object', 'null']
      title: Image
    file_name:
      type: ['string', 'null']
      title: File Name
      description: File name for download.
    file_url:
      type: ['string', 'null']
      format: uri
      title: File URL
      description: File download URL.
    file_ext:
      type: ['string', 'null']
      title: File Extension
      description: File extension.
    file_size:
      type: ['string', 'null']
      title: File Size
      description: File size.
    link_url:
      type: ['string', 'null']
      format: uri
      title: URL
      description: Link URL.
    link_is_new_window:
      type: ['boolean', 'null']
      title: New Window
      description: Whether to open the link in a new window.
    modifier_class:
      type: ['string', 'null']
      title: Modifier Class
      description: Additional CSS classes.
slots:
  image_over:
    title: Image Over
    description: Image overlay content.
  content_top:
    title: Content Top
    description: Top content area.
  title:
    title: Title
    description: Card title text.
  content_middle:
    title: Content Middle
    description: Middle content area.
  summary:
    title: Summary
    description: Card summary.
  content_bottom:
    title: Content Bottom
    description: Bottom content area.
